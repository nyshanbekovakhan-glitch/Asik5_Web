
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asik5</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <form id="f" class="card p-4 shadow-sm">
        <label for="name" class="form-label">UserName:</label>
        <input type="text" id="name" class="form-control" required>
        <br><br>
        <label for="birth" class="form-label">Birth Year:</label>
        <input type="number" id="birth" class="form-control" required>
        <br><br>
        <button type="submit" class="btn btn-primary">Create/Update Profile</button>

        <h2 class="mt-4">My Hobbies</h2>
        <input type="text" id="ii" class="form-control mb-2" placeholder="Enter hobby">
        <button type="button" id="add" class="btn btn-success mb-2">Add item</button>
        <button type="button" id="rm" class="btn btn-outline-danger mb-3">Remove item</button>
        <ul id="il">
            <li>Learning English</li>
            <li>Reading</li>
            <li>Tennis</li>
            <li>Taekwondo</li>
        </ul>
    </form>
    <script src="script.js"></script>
</body>
</html>
